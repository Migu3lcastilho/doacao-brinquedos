<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Um brinquedo, um sonho </title>
    <link rel="stylesheet" href="Contato.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>

<body>
   <header>
        <div class="logo">
            <img class="logo-header" src="Imagens/Group 10.png" alt="Logo">
        </div>
        <button id="btnMenu" class="hamburguer"><img src="Imagens/menu.png" alt=""></button>
        <div id="menu" class="topo">
            <button id="menuClose" class="menuClose">
                <img class="close" src="Imagens/close.png" alt="">
            </button>
            <a href="">HOME</a>
            <a class="divider" href="">|</a>
            <a href="">SOBRE NÓS</a>
            <a class="divider" href="">|</a>
            <a  href="">COMO DOAR</a>
            <a class="divider" href="">|</a>
            <a href="">CAMPANHAS</a>
            <a class="divider" href="">|</a>
            <a class="amarelo" href="">CONTATO</a>
        </div>
    </header>


    <div class="hero">
        <div class="lado-esquerdo">
            <div class="contato">
                <h1>Contato</h1>
                <p>Estamos aqui para te ajudar!</p>
            </div>
            <div class="informação">
                <img src="Imagens/ícone telefone.png" alt="Telefone">
                <p>(16) 98199-1579</p>
            </div>
            <div class="informação">
                <img src="Imagens/ícone instagram.png" alt="Instagram">
                <p>@brinqueedoe</p>
            </div>
            <div class="informação">
                <img src="Imagens/ícone email.png" alt="E-mail">
                <p>contato@brinquedoe.com.br</p>
            </div>
            <div class="informação">
                <img src="Imagens/ícone localização.png" alt="Localização">
                <p>Jaboticabal - SP</p>
            </div>
        </div>


        <div class="lado-direito">
            <img class="imagem-contato"
                src="Imagens/luca _ contato.png"
                alt="Ilustração">
            <form action="">
                <div class="campos">
                    <input type="text" required placeholder="Nome:">
                    <input type="email" required placeholder="E-mail:">
                </div>
                <input class="Assunto" type="text" required placeholder="Assunto:">
                <div class="Mensagem">
                    <textarea required placeholder="Mensagem:"></textarea>
                </div>
                <button class="Enviar" type="submit">
                    <span>Enviar mensagem</span>
                    <img src="Imagens/ícone enviar.png" alt="Enviar">
                </button>
            </form>
        </div>
    </div>
<Script src="menu.js"></Script>
</body>
</html>
